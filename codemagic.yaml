workflows:
  android-debug-apk:
    name: Business Document Backup - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Check Java
        script: |
          java -version

      - name: Install Gradle 8.13
        script: |
          curl -L --fail --retry 3 -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build debug APK
        script: |
          /tmp/gradle-8.13/bin/gradle assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk
